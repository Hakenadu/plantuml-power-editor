# Static hosting for the Angular build. TLS is terminated by the reverse proxy in front.

# Long-term caching only for content-hashed build output (main-XXXX.js, media/*-XXXX.woff2).
map $uri $cache_control {
    "~*-[A-Z0-9]{8}\.(js|css|woff2)$" "public, max-age=31536000, immutable";
    ~*^/media/                        "public, max-age=31536000, immutable";
    ~*\.(png|jpg|ico|svg|webmanifest)$ "public, max-age=86400";
    default                           "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Everything that is not the canonical host (e.g. plantuml.mseiche.de) moves permanently.
    if ($host != "plantuml-editor.com") {
        return 301 https://plantuml-editor.com$request_uri;
    }

    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
    }

    location / {
        # Single page app: unknown paths fall back to the editor.
        try_files $uri $uri/ /index.html;
    }

}
